version: 1
name: resume-tailor-agent-setup

requirements:
  - check: python3 --version || py -3 --version
  - check: python3 -m pip --version || py -3 -m pip --version

install_plan:
  - run: python3 -m pip install -r requirements.txt || py -3 -m pip install -r requirements.txt
  - run: python3 scripts/check_agent_platform_support.py || py -3 scripts/check_agent_platform_support.py

post_check:
  - ensure_exists: SKILL.md
  - ensure_exists: agents/openai.yaml
  - ensure_exists: scripts/extract_resume_text.py
  - ensure_exists: scripts/generate_final_resume.py
  - ensure_exists: references/resume-language-quality.md

report:
  - print: resume-tailor setup complete
  - print: personal data must be stored in a separate user workspace
