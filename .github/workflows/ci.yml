name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monkey-resume
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: monkey-resume
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - if: matrix.python-version == '3.12'
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - if: matrix.python-version == '3.12'
        run: skills-ref validate "${{ github.workspace }}/monkey-resume"
      - run: ruff check scripts templates tests
      - run: python -m unittest discover -s tests -v
